# Builds the iPhone/iPad app on one of GitHub's Macs and uploads it to TestFlight, so no Mac is
# needed. Runs on every push to the app-store branch (and from the Actions tab: "Run workflow").
#
# Safety: the App Store Connect key is handed only to the sign-and-upload step. Packages are
# installed earlier with their setup scripts turned off, at the exact versions in package-lock.json,
# and the only outside action is GitHub's own checkout, locked to one exact commit.
#
# Signing: the archive is signed ad hoc (that keeps the app's permissions, like Sign in with Apple),
# then Xcode re-signs it with Apple's cloud-managed distribution certificate while exporting, using
# the API key. No certificate files are stored anywhere.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_P8  - the App Store Connect API key ("Goalie builds")
#   APPLE_TEAM_ID                                     - the 10-character Apple Developer team ID

name: iPhone build to TestFlight

on:
  push:
    branches: [app-store]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          node --version

      - name: Install packages (setup scripts off; no secrets in this step)
        run: npm ci --ignore-scripts

      - name: Copy the app into the iPhone project
        run: npm run ios

      - name: Build the app (archive)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Goalie.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER=

      - name: Check the app's permissions (should list Sign in with Apple)
        run: codesign -d --entitlements - "$RUNNER_TEMP/Goalie.xcarchive/Products/Applications/App.app"

      - name: Sign with Apple's cloud certificate and upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$P8" > "$KEY"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Goalie.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows in TestFlight after Apple finishes processing (about 10-15 minutes)."
