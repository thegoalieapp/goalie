# Builds the iPhone/iPad app on one of GitHub's Macs and uploads it to TestFlight, so no Mac is
# needed. Runs on every push to the app-store branch (and from the Actions tab: "Run workflow").
#
# Safety: the App Store Connect key is handed only to the sign-and-upload step. Packages are
# installed earlier with their setup scripts turned off, at the exact versions in package-lock.json,
# and the only outside action is GitHub's own checkout, locked to one exact commit.
#
# Signing: the app is built unsigned, then given a temporary signature that carries its permissions
# (Sign in with Apple, Screen Time, the App Group). The export step re-signs it by hand with the
# Apple Distribution certificate and four signing profiles made in the developer portal ("Goalie App
# Store", "Goalie Monitor App Store", "Goalie Shield App Store", "Goalie Shield Action App Store"),
# because only hand-made profiles can include Family Controls (Distribution). The profiles are
# downloaded with the API key; the certificate sits in a temporary keychain during the step.
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_P8  - the App Store Connect API key ("Goalie builds")
#   APPLE_TEAM_ID                                     - the 10-character Apple Developer team ID
#   DIST_P12, DIST_P12_PASSWORD                       - the Apple Distribution certificate (base64 .p12) and its password

name: iPhone build to TestFlight

on:
  push:
    branches: [app-store]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          node --version

      - name: Install packages (setup scripts off; no secrets in this step)
        run: npm ci --ignore-scripts

      - name: Copy the app into the iPhone project
        run: npm run ios

      - name: Add the app-lock helpers to the project
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj --no-document
          ruby tools/add-lock-targets.rb

      # Unsigned: Xcode 26 refuses ad hoc signing while building ("not allowed with SDK iOS 26").
      # If it fails, the error lines are posted as annotations on the run page, which anyone can
      # read (the full log needs a GitHub sign-in).
      - name: Build the app (archive)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Goalie.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              grep -E 'error:|fatal' "$RUNNER_TEMP/archive.log" | sort -u | head -20 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }

      # Stamp each piece's permissions (Sign in with Apple, Screen Time, the shared App Group) on the
      # unsigned app and its lock helpers, helpers first, so the export step carries them over when it
      # signs everything for real.
      - name: Add the app's permissions (Sign in with Apple, Screen Time)
        run: |
          APP="$RUNNER_TEMP/Goalie.xcarchive/Products/Applications/App.app"
          for EXT in "$APP"/PlugIns/*.appex; do
            NAME=$(basename "$EXT" .appex)
            codesign --force --sign - --entitlements "ios/App/$NAME/$NAME.entitlements" --generate-entitlement-der "$EXT"
            echo "== $NAME"; codesign -d --entitlements - "$EXT"
          done
          codesign --force --sign - --entitlements ios/App/App/App.entitlements --generate-entitlement-der "$APP"
          echo "== App"; codesign -d --entitlements - "$APP"

      - name: Sign with the distribution certificate and upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          P8: ${{ secrets.APPSTORE_P8 }}
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          # Stray spaces or line breaks copied along with the IDs break the sign-in, so drop them.
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          DIST_P12_PASSWORD=$(printf '%s' "$DIST_P12_PASSWORD" | tr -d '[:space:]')
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          KC="$RUNNER_TEMP/goalie.keychain-db"
          trap 'rm -f "$KEY" "$RUNNER_TEMP/dist.p12"; security delete-keychain "$KC" 2>/dev/null || true' EXIT
          printf '%s\n' "$P8" | tr -d '\r' > "$KEY"
          export KEY_FILE="$KEY" KEY_ID ISSUER_ID

          # Check each secret's shape (reporting which one is off, never its value).
          bad=0
          [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPSTORE_KEY_ID isn't shaped like a Key ID (10 capital letters/numbers); it has ${#KEY_ID} characters"; bad=1; }
          [[ "$ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::APPSTORE_ISSUER_ID isn't shaped like an Issuer ID (the long ID with dashes above the Team Keys table); it has ${#ISSUER_ID} characters"; bad=1; }
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY" && grep -q -- '-----END PRIVATE KEY-----' "$KEY" || { echo "::error::APPSTORE_P8 is missing its BEGIN/END PRIVATE KEY lines (paste the whole .p8 file)"; bad=1; }
          [ -n "$DIST_P12" ] || { echo "::error::The DIST_P12 secret (the packaged distribution certificate) is missing"; bad=1; }
          [ -n "$DIST_P12_PASSWORD" ] || { echo "::error::The DIST_P12_PASSWORD secret is missing"; bad=1; }
          [ "$bad" = 0 ] || exit 1

          # Sign in to App Store Connect with the key directly, so a refusal is reported plainly.
          STATUS=$(node tools/app-store-connect.js check 2>&1) || true
          echo "App Store Connect key check: $STATUS"
          case "$STATUS" in
            200*) ;;
            401*) echo "::error::Apple refused the API key (401). The Key ID, Issuer ID and .p8 file don't belong together: re-enter all three from the same Team Key."; exit 1 ;;
            403*) echo "::error::Apple accepted the key but it lacks access (403): $STATUS. The key needs Admin access."; exit 1 ;;
            *) echo "::error::App Store Connect key check failed: $STATUS"; exit 1 ;;
          esac

          # Signing by hand: Apple's automatic signing can't include Family Controls (Distribution),
          # which only goes into profiles made in the developer portal with that entitlement chosen.
          # The distribution certificate goes into a temporary keychain, deleted when this step ends.
          KC_PASS=$(openssl rand -hex 20)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$DIST_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild \
            || { echo "::error::Couldn't open the distribution certificate: re-enter DIST_P12 and DIST_P12_PASSWORD"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" \
            || { echo "::error::DIST_P12 doesn't hold an Apple Distribution certificate"; exit 1; }

          # The four signing profiles, downloaded by name.
          node tools/app-store-connect.js profiles "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "Goalie App Store" "Goalie Monitor App Store" "Goalie Shield App Store" "Goalie Shield Action App Store" || exit 1

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.thegoalieapp.goalie</key><string>Goalie App Store</string>
              <key>com.thegoalieapp.goalie.monitor</key><string>Goalie Monitor App Store</string>
              <key>com.thegoalieapp.goalie.shield</key><string>Goalie Shield App Store</string>
              <key>com.thegoalieapp.goalie.shieldaction</key><string>Goalie Shield Action App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Goalie.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -iE 'error|fail' "$RUNNER_TEMP/export.log" | sort -u | head -20 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
          echo "Uploaded build ${{ github.run_number }}. It shows in TestFlight after Apple finishes processing (about 10-15 minutes)."
